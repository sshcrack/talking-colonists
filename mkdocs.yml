site_name: "MineColonies Talking Citizens"
site_url: "https://sshcrack.github.io/talking-colonists"
site_description: "Interactive voice chat with MineColonies citizens via Google Gemini AI"
site_author: "sshcrack"
repo_url: "https://github.com/sshcrack/talking-colonists"
repo_name: "sshcrack/talking-colonists"
edit_uri: edit/main/docs/
copyright: "MineColonies Talking Citizens"

theme:
  name: shadcn
  icon: assets/logo.png
  logo: assets/logo.png
  favicon: assets/logo.png
  custom_dir: overrides
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs
      arguments:
        theme: dark
        maxTextSize: 90000
        themeVariables:
          primaryColor: "#1e293b"
          primaryTextColor: "#f8fafc"
          primaryBorderColor: "#334155"
          lineColor: "#6366f1"
          secondaryColor: "#0f172a"
          tertiaryColor: "#1e293b"
          clusterBkg: "#0f172a"
          clusterBorder: "#334155"

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  extra:
  pymdownx.blocks.details:
  pymdownx.tabbed:
  pymdownx.blocks.tab:
    combine_header_slug: true
    separator: ___
  pymdownx.progressbar:
  pymdownx.snippets:
  pymdownx.superfences:
  pymdownx.highlight:
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.emoji:
  pymdownx.tasklist:
  pymdownx.caret:
  pymdownx.mark:
  pymdownx.tilde:
  pymdownx.smartsymbols:
  pymdownx.blocks.caption:
  pymdownx.magiclink:
  pymdownx.betterem:
  pymdownx.escapeall:
  pymdownx.pathconverter:
  pymdownx.striphtml:

extra_css:
  - assets/css/mermaid.css

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
    - Setup: getting-started/setup.md
    - Usage: getting-started/usage.md
  - Configuration:
    - Overview: configuration/index.md
    - API Settings: configuration/api.md
    - General: configuration/general.md
    - Citizens: configuration/citizens.md
  - Features:
    - Overview: features/index.md
    - Conversations: features/conversations.md
    - Personalities: features/personalities.md
    - Rumor Mill: features/rumor-mill.md
    - Broadcast System: features/broadcast.md
    - Memory System: features/memory.md
    - Audio Pregeneration: features/pregeneration.md
    - Urgent Contact: features/urgent-contact.md
    - Mumbling: features/mumbling.md
  - Architecture:
    - Overview: architecture/index.md
    - Prompt System: architecture/prompt-system.md
    - AI Tools: architecture/ai-tools.md
    - Voice Chat Integration: architecture/voice-chat.md
    - Platform Abstraction: architecture/platform-abstraction.md
  - Development:
    - Overview: development/index.md
    - Building: development/building.md
    - Contributing: development/contributing.md
    - API Reference: development/api.md
  - Changelog: changelog.md
  - Commands: commands.md
