name: reusable-build
on:
  workflow_call:
    inputs:
      release:
        description: "Whether this is a release build"
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    env:
      MOD_IS_RELEASE: ${{ inputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon --max-workers=1

      - name: Run both loader test suites
        run: ./gradlew :1.21.1-neoforge:test :1.20.1-forge:test --no-daemon --max-workers=1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-test-reports
          path: versions/*/build/reports/tests/

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

  client-smoke-verification:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      CLIENT_SMOKE_TIMEOUT_SECONDS: '600'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify required client launch smoke test was run locally
        run: |
          if [ ! -f .client-smoke-verified ]; then
            echo "ERROR: Client launch smoke test has not been verified."
            echo "Run 'bash scripts/test-client-smoke.sh' and commit .client-smoke-verified."
            exit 1
          fi

          verified=$(tr -d ' \n' < .client-smoke-verified)
          expected=$(python3 scripts/client-smoke-fingerprint.py head)
          if [ -z "$verified" ] || [ "$verified" != "$expected" ]; then
            echo "ERROR: Client launch smoke verification is stale."
            echo "verified: $verified"
            echo "expected: $expected"
            echo "Re-run 'bash scripts/test-client-smoke.sh' locally and commit .client-smoke-verified."
            exit 1
          fi

          echo "✓ Client launch smoke fingerprint matches committed launch-relevant content"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless graphics runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libasound2t64

      - name: Launch both clients and verify real citizen conversations
        run: xvfb-run -a bash scripts/test-client-smoke.sh

      - name: Upload launch and runtime verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-logs
          path: /tmp/client-smoke-*.log
